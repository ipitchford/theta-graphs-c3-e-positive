name: Exact internal regression
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python code/verify_all.py 24
      - run: python code/lemma6_check.py 24
      - run: python code/verify_csf.py code
      - run: python code/review_regressions.py
      - run: python -O code/review_regressions.py
